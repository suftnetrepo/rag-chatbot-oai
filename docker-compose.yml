version: "3.9"

# Starts Typesense only — PostgreSQL is assumed to be running locally.
# Usage: docker compose up -d

services:
  typesense:
    image: typesense/typesense:0.25.2
    container_name: rag-typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    command: >
      --data-dir /data
      --api-key ${TYPESENSE_API_KEY:-rag-typesense-key}
      --listen-port 8108
      --enable-cors
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  typesense_data:
    driver: local
